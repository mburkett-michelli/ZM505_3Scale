<script type="text/javascript">
   data_received = 0

function getVariable(http_request, id) {
  if ((http_request.readyState == 4) && (http_request.status == 200)) {
    parseVariable(http_request.responseText, id);
  }
  data_received = 0;
}

  
function parseVariable(data, variable_index) {
  if (variable_index ==98) {
    var appVar = JSON.parse(data) ; 
    versionStr = unescape(appVar.value) ; 
    document.getElementById("versionCell").innerHTML =  versionStr ; 		   
    if (versionStr.indexOf("ZM401")>0) {
     document.getElementById("scalePage").href = "scale401.html"  ;
    } else {
      document.getElementById("scalePage").href = "scale405.html"  ;
    }	
  }
}	

function pageLoop() {
  if (!data_received) {
	       makeRequest("get_var.cgi", getVariable, "index", 98);
         
  }
}
window.onload = pageLoop;

</script>
